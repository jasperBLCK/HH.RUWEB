{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>Подключение hh.ru</h3>
  {% if authorize_url %}
    <p><a href="{{ authorize_url }}" style="color:var(--accent)">Авторизоваться через hh OAuth</a></p>
  {% else %}
    <p class="muted">HH_CLIENT_ID не задан — укажи его в .env или вставь access_token вручную.</p>
  {% endif %}
  <form method="post" action="/auth/token" class="row">
    <input name="access_token" placeholder="access_token" style="flex:1" required>
    <button>Сохранить токен</button>
  </form>
  <p class="muted" style="margin-top:10px">Список резюме: <a href="/api/resumes" target="_blank" style="color:var(--muted)">/api/resumes</a></p>
</div>

<form class="card" method="post" action="/profile">
  <h3>Профиль кандидата</h3>
  <label>Имя</label>
  <input name="full_name" value="{{ profile.full_name }}">
  <label>resume_id (из /api/resumes)</label>
  <input name="resume_id" value="{{ profile.resume_id }}">
  <label>Резюме / опыт (текстом — идёт в промпт)</label>
  <textarea name="resume_text" rows="10">{{ profile.resume_text }}</textarea>
  <label>Навыки через запятую</label>
  <textarea name="skills" rows="3">{{ profile.skills }}</textarea>
  <label>Пожелания к работе</label>
  <textarea name="wishes" rows="4">{{ profile.wishes }}</textarea>
  <label>Минимальная зарплата</label>
  <input name="salary_min" type="number" value="{{ profile.salary_min }}">
  <label class="row" style="gap:8px; align-items:center">
    <input name="remote_only" type="checkbox" value="true" {% if profile.remote_only %}checked{% endif %} style="width:auto">
    Только удалённые вакансии
  </label>
  <label>Контакты и ссылки (подставляются в письмо)</label>
  <textarea name="links" rows="3">{{ profile.links }}</textarea>
  <div style="margin-top:14px"><button>Сохранить</button></div>
</form>
{% endblock %}
