<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HH.RUWEB</title>
  <style>
    :root { --bg:#000; --fg:#fff; --muted:#8a8a8a; --line:#242424; --panel:#0a0a0a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:15px/1.6 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
    a { color:var(--fg); }
    header { display:flex; gap:24px; align-items:center; padding:16px 32px; border-bottom:1px solid var(--line); }
    header a { text-decoration:none; color:var(--muted); }
    header a:hover, header a.active { color:var(--fg); }
    header .brand { color:var(--fg); font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    main { max-width:900px; margin:0 auto; padding:32px 24px 64px; }
    h1 { font-size:22px; margin:0 0 4px; font-weight:600; }
    h2 { font-size:15px; margin:0 0 12px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; }
    .card { border:1px solid var(--line); border-radius:4px; padding:20px; margin-bottom:16px; background:var(--panel); }
    .muted { color:var(--muted); font-size:13px; }
    .hint { color:var(--muted); font-size:13px; margin:4px 0 0; }
    input, textarea, select { width:100%; padding:10px 12px; background:#000; border:1px solid var(--line);
                              border-radius:4px; color:var(--fg); font:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--fg); }
    label { display:block; margin:16px 0 6px; font-size:13px; color:var(--muted); }
    button { padding:9px 16px; border:1px solid var(--fg); border-radius:4px; background:var(--fg);
             color:#000; font:inherit; font-weight:600; cursor:pointer; }
    button:hover { background:var(--muted); border-color:var(--muted); }
    button.ghost { background:transparent; color:var(--fg); border-color:var(--line); font-weight:400; }
    button.ghost:hover { border-color:var(--fg); }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .score { font-weight:700; border:1px solid var(--line); border-radius:4px; padding:2px 10px; color:var(--muted); }
    .score.high { border-color:var(--fg); color:var(--fg); }
    .tabs { display:flex; gap:18px; border-bottom:1px solid var(--line); padding:0 0 10px; margin-bottom:20px; }
    .tabs a { color:var(--muted); text-decoration:none; font-size:14px; }
    .tabs a.active { color:var(--fg); font-weight:600; }
    .badge { font-size:12px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; color:var(--muted); }
    .steps { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
    .step { flex:1; min-width:170px; border:1px solid var(--line); border-radius:4px; padding:12px 14px; }
    .step b { display:block; font-size:13px; margin-bottom:2px; }
    .step span { color:var(--muted); font-size:12px; }
    .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--muted); margin-right:6px; }
    .dot.on { background:var(--fg); }
    hr { border:0; border-top:1px solid var(--line); margin:20px 0; }
  </style>
</head>
<body>
<header>
  <a class="brand" href="/">HH.RUWEB</a>
  <a href="/" class="{{ 'active' if request.url.path == '/' }}">Вакансии</a>
  <a href="/profile" class="{{ 'active' if request.url.path == '/profile' }}">Профиль</a>
  <span class="muted" style="margin-left:auto">
    <span class="dot {{ 'on' if authorized }}"></span>hh {% if authorized %}подключён{% else %}не подключён{% endif %}
  </span>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
