<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HH.RUWEB</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#252a34; --text:#e8ecf1; --muted:#96a0ae; --accent:#d6001c; --ok:#2fbf71; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
    header { display:flex; gap:20px; align-items:center; padding:14px 28px; background:#12141a; border-bottom:1px solid var(--line); }
    header a { color:var(--text); text-decoration:none; font-weight:600; }
    header a.brand { color:var(--accent); font-size:18px; }
    main { max-width:1080px; margin:0 auto; padding:28px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
    .muted { color:var(--muted); font-size:13px; }
    input, textarea, select { width:100%; padding:10px; background:#0f1115; border:1px solid var(--line); border-radius:8px; color:var(--text); font:inherit; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:var(--muted); }
    button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.ghost { background:#222732; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .score { font-weight:700; border-radius:999px; padding:3px 10px; background:#222732; }
    .score.high { background:rgba(47,191,113,.18); color:var(--ok); }
    .tabs a { margin-right:12px; color:var(--muted); text-decoration:none; }
    .tabs a.active { color:var(--text); border-bottom:2px solid var(--accent); }
    .badge { font-size:12px; padding:2px 8px; border-radius:6px; background:#222732; color:var(--muted); }
  </style>
</head>
<body>
<header>
  <a class="brand" href="/">HH.RUWEB</a>
  <a href="/">Вакансии</a>
  <a href="/profile">Профиль</a>
  <span class="muted" style="margin-left:auto">
    hh: {% if authorized %}подключен{% else %}не подключен{% endif %}
  </span>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
